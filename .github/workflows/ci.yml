name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Separate job: Foundation Models needs the macOS 26 SDK (Xcode 26+), which
  # the macos-latest image may not ship. A failure here does not affect `check`.
  helper:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build tgsort-ai (arm64)
        working-directory: helpers/tgsort-ai
        run: swift build -c release --arch arm64

      - name: Self-test
        working-directory: helpers/tgsort-ai
        run: |
          bin="$(swift build -c release --arch arm64 --show-bin-path)/tgsort-ai"
          "$bin" --self-test
