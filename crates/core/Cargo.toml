[package]
name = "tgsort-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Core library of tgsort: config, rule matching and safe file moving"

[lib]
name = "tgsort_core"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "5"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
