[package]
name = "tgsort"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Watch Telegram Desktop downloads and sort them into folders by rule"

[[bin]]
name = "tgsort"
path = "src/main.rs"

[dependencies]
tgsort-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
notify = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
