[package]
name = "tgsort"
version = "0.1.0"
edition = "2021"
description = "Watch Telegram Desktop downloads and sort them into folders by rule"

[[bin]]
name = "tgsort"
path = "src/main.rs"

[dependencies]
tgsort-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
notify = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"

[dev-dependencies]
tempfile = "3"
